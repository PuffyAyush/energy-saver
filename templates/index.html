<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Energy Calculator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="title-icon">⚡</div>
        <h1>ENERGY CALCULATOR</h1>
    </header>


    <!-- INPUT SECTION -->
    <section class="input-card">

        <div class="input-row">

            <label for="appliance">
                Appliance
            </label>

            <select id="appliance">

                <option value="">Select Appliance</option>

                <option value="Fan">Fan</option>
                <option value="LED Bulb">LED Bulb</option>
                <option value="TV">TV</option>
                <option value="Refrigerator">Refrigerator</option>
                <option value="Air Conditioner">Air Conditioner</option>
                <option value="Washing Machine">Washing Machine</option>
                <option value="Computer">Computer</option>
                <option value="Other">Other</option>

            </select>

        </div>


        <!-- OTHER APPLIANCE -->
        <div class="input-row hidden" id="otherRow">

            <label for="otherAppliance">
                Appliance Name
            </label>

            <input
                type="text"
                id="otherAppliance"
                placeholder="Enter appliance name"
            >

        </div>


        <!-- POWER -->
        <div class="input-row">

            <label for="power">
                Power (Watts)
            </label>

            <input
                type="number"
                id="power"
                placeholder="Enter power in watts"
                min="0"
                step="0.1"
            >

        </div>


        <!-- HOURS -->
        <div class="input-row">

            <label for="hours">
                Hours Used / Day
            </label>

            <input
                type="number"
                id="hours"
                placeholder="Enter hours per day"
                min="0"
                step="0.1"
            >

        </div>


        <!-- COST -->
        <div class="input-row">

            <label for="cost">
                Cost per Unit (₹)
            </label>

            <input
                type="number"
                id="cost"
                placeholder="Enter electricity cost"
                min="0"
                step="0.01"
            >

        </div>


        <!-- ERROR -->
        <div id="errorBox" class="error-box hidden"></div>

    </section>


    <!-- BUTTONS -->
    <div class="buttons">

        <button
            class="calculate-btn"
            onclick="calculateEnergy()">
            Calculate
        </button>

        <button
            class="reset-btn"
            onclick="resetCalculator()">
            Reset
        </button>

    </div>


    <!-- RESULTS -->
    <section class="results-card">

        <h2>RESULTS</h2>

        <div class="result-row">
            <span>Daily Usage :</span>
            <strong id="dailyUsage">--</strong>
        </div>

        <div class="result-row">
            <span>Monthly Usage :</span>
            <strong id="monthlyUsage">--</strong>
        </div>

        <div class="result-row">
            <span>Monthly Bill :</span>
            <strong id="monthlyBill">--</strong>
        </div>

        <div class="result-row">
            <span>Estimated Saving :</span>
            <strong id="estimatedSaving">--</strong>
        </div>

    </section>


    <!-- SUGGESTIONS -->
    <section class="suggestions-card">

        <h2>Energy Saving Suggestions</h2>

        <div id="suggestions">

            <div class="suggestion neutral">

                💡 <strong>READY TO CALCULATE</strong>

                <br>

                Enter your appliance details and click
                <b>Calculate</b> to see your energy usage
                and personalized suggestions.

            </div>

        </div>

    </section>

</div>


<script>

/* ==========================================
   APPLIANCE DEFAULT POWER
   ========================================== */

const appliancePower = {

    "Fan": 75,

    "LED Bulb": 10,

    "TV": 100,

    "Refrigerator": 180,

    "Air Conditioner": 1500,

    "Washing Machine": 500,

    "Computer": 250

};


/* ==========================================
   APPLIANCE DROPDOWN
   ========================================== */

const applianceSelect =
    document.getElementById("appliance");

const powerInput =
    document.getElementById("power");

const otherRow =
    document.getElementById("otherRow");


applianceSelect.addEventListener("change", function () {

    const appliance = this.value;


    /* OTHER */

    if (appliance === "Other") {

        otherRow.classList.remove("hidden");

        powerInput.value = "";

        powerInput.placeholder =
            "Enter power in watts";

        powerInput.focus();

        return;
    }


    /* HIDE OTHER */

    otherRow.classList.add("hidden");

    document.getElementById("otherAppliance").value = "";


    /* AUTOMATIC POWER */

    if (appliancePower[appliance]) {

        powerInput.value =
            appliancePower[appliance];

    } else {

        powerInput.value = "";

    }

});


/* ==========================================
   CALCULATE
   ========================================== */

function calculateEnergy() {

    clearError();


    const appliance =
        applianceSelect.value;

    const power =
        parseFloat(powerInput.value);

    const hours =
        parseFloat(
            document.getElementById("hours").value
        );

    const cost =
        parseFloat(
            document.getElementById("cost").value
        );


    /* ======================================
       VALIDATION
       ====================================== */

    if (appliance === "") {

        showError(
            "Please select an appliance."
        );

        return;
    }


    if (appliance === "Other") {

        const otherName =
            document.getElementById(
                "otherAppliance"
            ).value.trim();


        if (otherName === "") {

            showError(
                "Please enter the appliance name."
            );

            return;
        }

    }


    if (isNaN(power)) {

        showError(
            "Please enter the power consumption."
        );

        return;
    }


    if (power <= 0) {

        showError(
            "Power can't be 0 or negative."
        );

        return;
    }


    if (isNaN(hours)) {

        showError(
            "Please enter the hours used per day."
        );

        return;
    }


    if (hours <= 0) {

        showError(
            "Hours used must be greater than 0."
        );

        return;
    }


    if (hours > 24) {

        showError(
            "There are only 24 hours in a day."
        );

        return;
    }


    if (isNaN(cost)) {

        showError(
            "Please enter the cost per unit."
        );

        return;
    }


    if (cost <= 0) {

        showError(
            "Cost can't be negative or 0."
        );

        return;
    }


    /* ======================================
       CALCULATIONS
       ====================================== */

    const dailyUsage =
        (power * hours) / 1000;


    const monthlyUsage =
        dailyUsage * 30;


    const monthlyBill =
        monthlyUsage * cost;


    const estimatedSaving =
        monthlyBill * 0.20;


    /* ======================================
       DISPLAY RESULTS
       ====================================== */

    document.getElementById(
        "dailyUsage"
    ).textContent =
        dailyUsage.toFixed(2) + " kWh";


    document.getElementById(
        "monthlyUsage"
    ).textContent =
        monthlyUsage.toFixed(2) + " kWh";


    document.getElementById(
        "monthlyBill"
    ).textContent =
        "₹" + monthlyBill.toFixed(2);


    document.getElementById(
        "estimatedSaving"
    ).textContent =
        "₹" + estimatedSaving.toFixed(2);


    /* ======================================
       SUGGESTIONS
       ====================================== */

    updateSuggestions(
        appliance,
        power,
        hours,
        dailyUsage,
        monthlyUsage
    );

}


/* ==========================================
   SUGGESTIONS
   ========================================== */

function updateSuggestions(
    appliance,
    power,
    hours,
    dailyUsage,
    monthlyUsage
) {

    const suggestions =
        document.getElementById(
            "suggestions"
        );


    let html = "";


    /* ======================================
       POWER LEVEL
       ====================================== */

    if (power <= 50) {

        html += `
            <div class="suggestion good">

                🟢 <strong>LOW POWER USAGE</strong>

                <br>

                Your appliance is using a
                relatively low amount of power.

            </div>
        `;

    }

    else if (power <= 150) {

        html += `
            <div class="suggestion good">

                🟢 <strong>GOOD POWER USAGE</strong>

                <br>

                Your appliance has a reasonable
                power consumption.

            </div>
        `;

    }

    else if (power <= 500) {

        html += `
            <div class="suggestion average">

                🟡 <strong>AVERAGE POWER USAGE</strong>

                <br>

                Your appliance is using a
                moderate amount of electricity.

            </div>
        `;

    }

    else if (power <= 1000) {

        html += `
            <div class="suggestion warning">

                🟠 <strong>HIGH POWER USAGE</strong>

                <br>

                This appliance consumes a
                significant amount of electricity.
                Try reducing its usage when possible.

            </div>
        `;

    }

    else {

        html += `
            <div class="suggestion danger">

                🔴 <strong>⚠️ VERY HIGH POWER USAGE</strong>

                <br>

                This appliance is consuming a
                very large amount of electricity.

                Consider reducing its operating time.

            </div>
        `;

    }


    /* ======================================
       DAILY USAGE
       ====================================== */

    if (dailyUsage <= 1) {

        html += `
            <div class="suggestion good">

                🟢 <strong>LOW DAILY CONSUMPTION</strong>

                <br>

                Your estimated daily electricity
                consumption is low.

            </div>
        `;

    }

    else if (dailyUsage <= 3) {

        html += `
            <div class="suggestion good">

                🟢 <strong>GOOD DAILY CONSUMPTION</strong>

                <br>

                Your daily electricity usage
                is at a reasonable level.

            </div>
        `;

    }

    else if (dailyUsage <= 6) {

        html += `
            <div class="suggestion average">

                🟡 <strong>AVERAGE DAILY CONSUMPTION</strong>

                <br>

                Your appliance is consuming a
                noticeable amount of electricity.

            </div>
        `;

    }

    else {

        html += `
            <div class="suggestion danger">

                🔴 <strong>⚠️ HIGH DAILY CONSUMPTION</strong>

                <br>

                Your appliance is consuming a lot
                of electricity every day.

                Consider reducing its usage time.

            </div>
        `;

    }


    /* ======================================
       HOURS
       ====================================== */

    if (hours >= 12) {

        html += `
            <div class="suggestion warning">

                🟠 <strong>LONG DAILY USAGE</strong>

                <br>

                You are using this appliance for
                ${hours} hours per day.

                Turning it off when not needed
                can save electricity.

            </div>
        `;

    }

    else if (hours <= 4) {

        html += `
            <div class="suggestion good">

                🟢 <strong>GOOD USAGE TIME</strong>

                <br>

                Your daily usage time is relatively low.

            </div>
        `;

    }


    /* ======================================
       APPLIANCE-SPECIFIC TIPS
       ====================================== */

    if (appliance === "Fan") {

        html += `
            <div class="suggestion tip">

                💡 <strong>FAN TIP</strong>

                <br>

                Turn off the fan when leaving the room.
                Using a timer can also reduce unnecessary
                electricity consumption.

            </div>
        `;

    }

    else if (appliance === "LED Bulb") {

        html += `
            <div class="suggestion tip">

                💡 <strong>LIGHTING TIP</strong>

                <br>

                Switch off lights in empty rooms
                and use natural sunlight whenever possible.

            </div>
        `;

    }

    else if (appliance === "TV") {

        html += `
            <div class="suggestion tip">

                💡 <strong>TV TIP</strong>

                <br>

                Avoid leaving the TV on when nobody
                is watching it.

            </div>
        `;

    }

    else if (appliance === "Refrigerator") {

        html += `
            <div class="suggestion tip">

                💡 <strong>REFRIGERATOR TIP</strong>

                <br>

                Avoid opening the refrigerator
                unnecessarily and keep the door
                properly closed.

            </div>
        `;

    }

    else if (appliance === "Air Conditioner") {

        html += `
            <div class="suggestion tip">

                💡 <strong>AC TIP</strong>

                <br>

                Setting the AC around 24°C can help
                balance comfort and electricity usage.
                Keep doors and windows closed while
                the AC is running.

            </div>
        `;

    }

    else if (appliance === "Washing Machine") {

        html += `
            <div class="suggestion tip">

                💡 <strong>WASHING MACHINE TIP</strong>

                <br>

                Running full loads instead of several
                small loads can help save electricity
                and water.

            </div>
        `;

    }

    else if (appliance === "Computer") {

        html += `
            <div class="suggestion tip">

                💡 <strong>COMPUTER TIP</strong>

                <br>

                Use sleep mode when your computer
                is not being used for a while.

            </div>
        `;

    }

    else {

        html += `
            <div class="suggestion tip">

                💡 <strong>ENERGY SAVING TIP</strong>

                <br>

                Switch off the appliance when it is
                not needed to avoid unnecessary
                electricity consumption.

            </div>
        `;

    }


    /* ======================================
       MONTHLY USAGE
       ====================================== */

    if (monthlyUsage > 200) {

        html += `
            <div class="suggestion danger">

                🔴 <strong>⚠️ HIGH MONTHLY CONSUMPTION</strong>

                <br>

                Your estimated monthly consumption is
                ${monthlyUsage.toFixed(2)} kWh.

                Try reducing unnecessary usage.

            </div>
        `;

    }


    suggestions.innerHTML = html;

}


/* ==========================================
   ERROR
   ========================================== */

function showError(message) {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        "⚠️ " + message;


    errorBox.classList.remove(
        "hidden"
    );

}


function clearError() {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent = "";


    errorBox.classList.add(
        "hidden"
    );

}


/* ==========================================
   RESET
   ========================================== */

function resetCalculator() {

    applianceSelect.value = "";

    powerInput.value = "";

    document.getElementById(
        "hours"
    ).value = "";

    document.getElementById(
        "cost"
    ).value = "";

    document.getElementById(
        "otherAppliance"
    ).value = "";


    otherRow.classList.add(
        "hidden"
    );


    document.getElementById(
        "dailyUsage"
    ).textContent = "--";


    document.getElementById(
        "monthlyUsage"
    ).textContent = "--";


    document.getElementById(
        "monthlyBill"
    ).textContent = "--";


    document.getElementById(
        "estimatedSaving"
    ).textContent = "--";


    clearError();


    document.getElementById(
        "suggestions"
    ).innerHTML = `

        <div class="suggestion neutral">

            💡 <strong>READY TO CALCULATE</strong>

            <br>

            Enter your appliance details and
            click <b>Calculate</b>.

        </div>

    `;

}

</script>

</body>
</html>
